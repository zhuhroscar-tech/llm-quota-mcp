name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev + mcp extras
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/ -v
        # Note: the Hermes-CLI-integration tests in tests/test_hermes.py
        # auto-skip on CI since no `hermes` binary is installed here; the
        # Anthropic/OpenAI tests run fully mocked (no real API keys used
        # or needed in CI).
      - name: Verify CLI entry points install correctly
        run: |
          llm-quota --help
          python -c "from llm_quota import mcp_server; print('mcp_server imports OK')"
      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r src/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: llm-quota-mcp-dist
          path: dist/
